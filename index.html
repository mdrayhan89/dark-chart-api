<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DARK SECRET Trading Chart</title>
  <script src="https://unpkg.com/lightweight-charts@4.0.1/dist/lightweight-charts.standalone.production.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      background-color: #000000 !important;
      color: #e0e0e0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
    }
    
    .chart-frame {
      position: absolute;
      top: 10px;
      bottom: 10px;
      left: 10px;
      right: 10px;
      background: #000000;
      border: 2px solid #b3875a;
      border-radius: 6px;
      box-shadow: 0 0 20px rgba(179, 135, 90, 0.2);
      padding: 10px;
      display: flex;
      flex-direction: column;
    }
    
    /* Header Logo */
    .header-logo {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      text-align: center;
      pointer-events: none;
    }
    .crown-icon { color: #d4af37; font-size: 14px; letter-spacing: 3px; margin-bottom: -2px; }
    .brand-title { color: #e5c158; font-size: 16px; font-weight: 700; letter-spacing: 3px; text-transform: uppercase; text-shadow: 0 0 10px rgba(212,175,55,0.4); }

    /* Pair Info Badge */
    .pair-badge {
      position: absolute;
      top: 15px;
      left: 20px;
      z-index: 10;
      background: rgba(30, 30, 30, 0.9);
      border: 1px solid #444;
      padding: 5px 12px;
      border-radius: 4px;
      font-size: 13px;
      font-weight: bold;
      color: #fff;
    }

    /* Signal Indicator Box */
    .signal-box {
      position: absolute;
      top: 15px;
      right: 20px;
      z-index: 10;
      padding: 6px 16px;
      border-radius: 4px;
      font-size: 13px;
      font-weight: bold;
      display: none;
      color: #fff;
      animation: pulse 1.2s infinite alternate;
    }
    .signal-put { background: #e53935; box-shadow: 0 0 10px rgba(229, 57, 53, 0.6); }
    .signal-call { background: #43a047; box-shadow: 0 0 10px rgba(67, 160, 71, 0.6); }

    @keyframes pulse {
      from { opacity: 0.7; }
      to { opacity: 1; transform: scale(1.02); }
    }

    #chartContainer {
      width: 100%;
      height: 100%;
      background-color: #000000;
      margin-top: 25px;
    }
  </style>
</head>
<body>

  <div class="chart-frame">
    <div class="pair-badge" id="pairDisplay">5 GBP/USD</div>
    <div class="header-logo">
      <div class="crown-icon">♔♔♔</div>
      <div class="brand-title">DARK SECRET</div>
    </div>
    
    <div class="signal-box" id="signalBox">▼ PUT</div>

    <div id="chartContainer"></div>
  </div>

<script>
  // 1. Pair Mapping
  const SUPPORTED_PAIRS = {
    'EUR/USD': 'frxEURUSD', 'EURUSD': 'frxEURUSD',
    'USD/JPY': 'frxUSDJPY', 'USDJPY': 'frxUSDJPY',
    'CAD/JPY': 'frxCADJPY', 'CADJPY': 'frxCADJPY',
    'AUD/CAD': 'frxAUDCAD', 'AUDCAD': 'frxAUDCAD',
    'GBP/USD': 'frxGBPUSD', 'GBPUSD': 'frxGBPUSD',
    'EUR/JPY': 'frxEURJPY', 'EURJPY': 'frxEURJPY',
    'AUD/JPY': 'frxAUDJPY', 'AUDJPY': 'frxAUDJPY',
    'AUD/USD': 'frxAUDUSD', 'AUDUSD': 'frxAUDUSD',
    'EUR/GBP': 'frxEURGBP', 'EURGBP': 'frxEURGBP',
    'AUD/CHF': 'frxAUDCHF', 'AUDCHF': 'frxAUDCHF',
    'EUR/CAD': 'frxEURCAD', 'EURCAD': 'frxEURCAD',
    'GBP/CAD': 'frxGBPCAD', 'GBPCAD': 'frxGBPCAD'
  };

  // 2. Parse URL Parameter
  function getSelectedPair() {
    const urlParams = new URLSearchParams(window.location.search);
    let pairParam = urlParams.get('pair');
    
    if (!pairParam) {
      const pathParts = window.location.pathname.split('/').filter(Boolean);
      if (pathParts.length > 0) {
        pairParam = decodeURIComponent(pathParts[pathParts.length - 1]);
      }
    }

    if (pairParam) {
      const cleanPair = pairParam.toUpperCase().replace('-', '/');
      if (SUPPORTED_PAIRS[cleanPair]) return cleanPair;
    }
    return 'GBP/USD';
  }

  const currentPair = getSelectedPair();
  const derivSymbol = SUPPORTED_PAIRS[currentPair];
  document.getElementById('pairDisplay').innerText = `5 ${currentPair}`;

  // 3. TradingView Chart Setup
  const container = document.getElementById('chartContainer');
  const chart = LightweightCharts.createChart(container, {
    width: container.clientWidth,
    height: container.clientHeight,
    layout: {
      background: { type: 'solid', color: '#000000' },
      textColor: '#888888',
    },
    grid: {
      vertLines: { color: '#151515' },
      horzLines: { color: '#151515' },
    },
    crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
    rightPriceScale: { borderColor: '#222222' },
    timeScale: { borderColor: '#222222', timeVisible: true, secondsVisible: false }
  });

  const candleSeries = chart.addCandlestickSeries({
    upColor: '#26a69a',
    downColor: '#ef5350',
    borderUpColor: '#26a69a',
    borderDownColor: '#ef5350',
    wickUpColor: '#26a69a',
    wickDownColor: '#ef5350'
  });

  // 4. WebSocket Data Feed
  let ws;
  let currentCandle = null;

  function connectMarketData() {
    ws = new WebSocket('wss://ws.binaryws.com/websockets/v3?app_id=1089');

    ws.onopen = () => {
      ws.send(JSON.stringify({
        ticks_history: derivSymbol,
        adjust_start_time: 1,
        count: 100,
        end: 'latest',
        granularity: 60,
        style: 'candles'
      }));

      ws.send(JSON.stringify({ ticks: derivSymbol }));
    };

    ws.onmessage = (event) => {
      const data = JSON.parse(event.data);

      if (data.msg_type === 'candles') {
        const history = data.candles.map(c => ({
          time: c.epoch,
          open: c.open,
          high: c.high,
          low: c.low,
          close: c.close
        }));
        candleSeries.setData(history);
        if (history.length > 0) {
          currentCandle = { ...history[history.length - 1] };
        }
      }

      if (data.msg_type === 'tick') {
        const tick = data.tick;
        const tickTime = Math.floor(tick.epoch / 60) * 60;

        if (!currentCandle || currentCandle.time !== tickTime) {
          currentCandle = {
            time: tickTime,
            open: tick.quote,
            high: tick.quote,
            low: tick.quote,
            close: tick.quote
          };
        } else {
          currentCandle.high = Math.max(currentCandle.high, tick.quote);
          currentCandle.low = Math.min(currentCandle.low, tick.quote);
          currentCandle.close = tick.quote;
        }
        candleSeries.update(currentCandle);
      }
    };

    ws.onclose = () => setTimeout(connectMarketData, 3000);
  }

  connectMarketData();

  // Resize Handler
  window.addEventListener('resize', () => {
    chart.applyOptions({
      width: container.clientWidth,
      height: container.clientHeight
    });
  });

  // Signal Trigger Function
  window.showSignal = function(type) {
    const box = document.getElementById('signalBox');
    if (type === 'PUT') {
      box.className = 'signal-box signal-put';
      box.innerText = '▼ PUT';
      box.style.display = 'block';
    } else if (type === 'CALL') {
      box.className = 'signal-box signal-call';
      box.innerText = '▲ CALL';
      box.style.display = 'block';
    } else {
      box.style.display = 'none';
    }
  };
</script>
</body>
</html>
