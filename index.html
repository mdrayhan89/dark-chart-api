<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DARK SECRET Custom Real-Tick Chart</title>
  <script src="https://unpkg.com/lightweight-charts@3.8.0/dist/lightweight-charts.standalone.production.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100vw;
      height: 100vh;
      background-color: #000000;
      color: #e0e0e0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .chart-frame {
      position: relative;
      width: 98vw;
      height: 95vh;
      background: #000000;
      border: 2px solid #b3875a;
      border-radius: 6px;
      box-shadow: 0 0 25px rgba(179, 135, 90, 0.25);
      padding: 10px;
    }
    
    /* Header Logo */
    .header-logo {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      text-align: center;
      pointer-events: none;
    }
    .crown-icon { color: #d4af37; font-size: 14px; letter-spacing: 3px; }
    .brand-title { color: #e5c158; font-size: 16px; font-weight: 700; letter-spacing: 3px; text-transform: uppercase; text-shadow: 0 0 10px rgba(212,175,55,0.4); }

    /* Pair Info Badge */
    .pair-badge {
      position: absolute;
      top: 12px;
      left: 15px;
      z-index: 10;
      background: rgba(20, 20, 20, 0.9);
      border: 1px solid #333;
      padding: 6px 12px;
      border-radius: 4px;
      font-size: 13px;
      font-weight: bold;
      color: #fff;
    }

    /* Signal Indicator Box */
    .signal-box {
      position: absolute;
      top: 12px;
      right: 15px;
      z-index: 10;
      padding: 6px 16px;
      border-radius: 4px;
      font-size: 13px;
      font-weight: bold;
      display: none;
      color: #fff;
      animation: pulse 1.2s infinite alternate;
    }
    .signal-put { background: #e53935; box-shadow: 0 0 10px rgba(229, 57, 53, 0.6); }
    .signal-call { background: #43a047; box-shadow: 0 0 10px rgba(67, 160, 71, 0.6); }

    @keyframes pulse {
      from { opacity: 0.7; }
      to { opacity: 1; transform: scale(1.02); }
    }

    #chartArea {
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>

  <div class="chart-frame">
    <div class="pair-badge" id="pairDisplay">5 EUR/USD</div>
    <div class="header-logo">
      <div class="crown-icon">♔♔♔</div>
      <div class="brand-title">DARK SECRET</div>
    </div>
    
    <div class="signal-box" id="signalBox">▼ PUT</div>

    <div id="chartArea"></div>
  </div>

<script>
  // Forex Symbol Mapping matrix for TV direct tick feed
  const PAIR_MAP = {
    'EUR/USD': 'FX:EURUSD', 'EURUSD': 'FX:EURUSD',
    'USD/JPY': 'FX:USDJPY', 'USDJPY': 'FX:USDJPY',
    'CAD/JPY': 'FX:CADJPY', 'CADJPY': 'FX:CADJPY',
    'AUD/CAD': 'FX:AUDCAD', 'AUDCAD': 'FX:AUDCAD',
    'GBP/USD': 'FX:GBPUSD', 'GBPUSD': 'FX:GBPUSD',
    'EUR/JPY': 'FX:EURJPY', 'EURJPY': 'FX:EURJPY',
    'AUD/JPY': 'FX:AUDJPY', 'AUDJPY': 'FX:AUDJPY',
    'AUD/USD': 'FX:AUDUSD', 'AUDUSD': 'FX:AUDUSD',
    'EUR/GBP': 'FX:EURGBP', 'EURGBP': 'FX:EURGBP',
    'AUD/CHF': 'FX:AUDCHF', 'AUDCHF': 'FX:AUDCHF',
    'EUR/CAD': 'FX:EURCAD', 'EURCAD': 'FX:EURCAD',
    'GBP/CAD': 'FX:GBPCAD', 'GBPCAD': 'FX:GBPCAD'
  };

  function getSelectedPair() {
    const urlParams = new URLSearchParams(window.location.search);
    let pairParam = urlParams.get('pair');
    if (!pairParam) {
      const pathParts = window.location.pathname.split('/').filter(Boolean);
      if (pathParts.length > 0) pairParam = decodeURIComponent(pathParts[pathParts.length - 1]);
    }
    if (pairParam) {
      let clean = pairParam.toUpperCase().replace('-', '/');
      if (PAIR_MAP[clean]) return clean;
    }
    return 'EUR/USD';
  }

  const currentPair = getSelectedPair();
  const tvSymbol = PAIR_MAP[currentPair] || 'FX:EURUSD';
  document.getElementById('pairDisplay').innerText = `5 ${currentPair}`;

  const UTC6_OFFSET = 6 * 3600;

  // Render Engine (Lightweight Chart Canvas)
  const container = document.getElementById('chartArea');
  const chart = LightweightCharts.createChart(container, {
    width: container.clientWidth,
    height: container.clientHeight,
    layout: {
      backgroundColor: '#000000',
      textColor: '#888888',
    },
    grid: {
      vertLines: { color: '#111111' },
      horzLines: { color: '#111111' },
    },
    crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
    rightPriceScale: { borderColor: '#222222', visible: true },
    timeScale: { 
      borderColor: '#222222', 
      timeVisible: true, 
      secondsVisible: true,
      tickMarkFormatter: (time) => {
        const date = new Date((time + UTC6_OFFSET) * 1000);
        const hours = String(date.getUTCHours()).padStart(2, '0');
        const minutes = String(date.getUTCMinutes()).padStart(2, '0');
        return `${hours}:${minutes}`;
      }
    },
    localization: {
      timeFormatter: (time) => {
        const date = new Date((time + UTC6_OFFSET) * 1000);
        const hours = String(date.getUTCHours()).padStart(2, '0');
        const minutes = String(date.getUTCMinutes()).padStart(2, '0');
        const seconds = String(date.getUTCSeconds()).padStart(2, '0');
        return `${hours}:${minutes}:${seconds}`;
      }
    }
  });

  const candleSeries = chart.addCandlestickSeries({
    upColor: '#26a69a',
    downColor: '#ef5350',
    borderUpColor: '#26a69a',
    borderDownColor: '#ef5350',
    wickUpColor: '#26a69a',
    wickDownColor: '#ef5350'
  });

  let currentCandle = null;

  // TradingView Direct Fast Socket Streamer
  function connectTradingViewTickFeed() {
    const ws = new WebSocket("wss://data.tradingview.com/socket.io/websocket");

    ws.onopen = () => {
      const authMsg = JSON.stringify({ m: "set_auth_token", p: ["unauthorized_user_token"] });
      const sessionMsg = JSON.stringify({ m: "chart_create_session", p: ["cs_custom_session", ""] });
      const symbolMsg = JSON.stringify({
        m: "resolve_symbol",
        p: ["cs_custom_session", "sds_sym_1", `={"symbol":"${tvSymbol}","adjustment":"splits"}`]
      });
      const seriesMsg = JSON.stringify({
        m: "create_series",
        p: ["cs_custom_session", "sds_1", "s1", "sds_sym_1", "1", 300]
      });

      ws.send(`~m~${authMsg.length}~m~${authMsg}`);
      ws.send(`~m~${sessionMsg.length}~m~${sessionMsg}`);
      ws.send(`~m~${symbolMsg.length}~m~${symbolMsg}`);
      ws.send(`~m~${seriesMsg.length}~m~${seriesMsg}`);
    };

    ws.onmessage = (event) => {
      const raw = event.data;
      if (raw.includes("~m~")) {
        const parts = raw.split(/~m~\d+~m~/).filter(Boolean);
        parts.forEach(part => {
          try {
            const parsed = JSON.parse(part);
            if (parsed.m === "timescale_update" || parsed.m === "du") {
              const seriesData = parsed.p[1]?.sds_1?.s;
              if (seriesData && seriesData.length > 0) {
                const history = seriesData.map(c => ({
                  time: c.v[0],
                  open: c.v[1],
                  high: c.v[2],
                  low: c.v[3],
                  close: c.v[4]
                }));
                candleSeries.setData(history);
                currentCandle = { ...history[history.length - 1] };
              }
            }
          } catch(e) {}
        });
      }
    };

    ws.onclose = () => setTimeout(connectTradingViewTickFeed, 3000);
  }

  connectTradingViewTickFeed();

  window.addEventListener('resize', () => {
    chart.applyOptions({
      width: container.clientWidth,
      height: container.clientHeight
    });
  });

  // Signal Bot Handler
  window.showSignal = function(type) {
    const box = document.getElementById('signalBox');
    if (type === 'PUT') {
      box.className = 'signal-box signal-put';
      box.innerText = '▼ PUT';
      box.style.display = 'block';
    } else if (type === 'CALL') {
      box.className = 'signal-box signal-call';
      box.innerText = '▲ CALL';
      box.style.display = 'block';
    } else {
      box.style.display = 'none';
    }
  };
</script>
</body>
</html>
