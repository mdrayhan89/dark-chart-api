<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DARK SECRET Trading Chart</title>
  <script src="https://unpkg.com/lightweight-charts@3.8.0/dist/lightweight-charts.standalone.production.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100vw;
      height: 100vh;
      background-color: #000000;
      color: #e0e0e0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .chart-frame {
      position: relative;
      width: 98vw;
      height: 95vh;
      background: #000000;
      border: 2px solid #b3875a;
      border-radius: 6px;
      box-shadow: 0 0 25px rgba(179, 135, 90, 0.25);
      padding: 10px;
    }
    
    /* Header Logo */
    .header-logo {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      text-align: center;
      pointer-events: none;
    }
    .crown-icon { color: #d4af37; font-size: 14px; letter-spacing: 3px; }
    .brand-title { color: #e5c158; font-size: 16px; font-weight: 700; letter-spacing: 3px; text-transform: uppercase; text-shadow: 0 0 10px rgba(212,175,55,0.4); }

    /* Pair Info Badge */
    .pair-badge {
      position: absolute;
      top: 12px;
      left: 15px;
      z-index: 10;
      background: rgba(20, 20, 20, 0.9);
      border: 1px solid #333;
      padding: 6px 12px;
      border-radius: 4px;
      font-size: 13px;
      font-weight: bold;
      color: #fff;
    }

    /* Signal Indicator Box */
    .signal-box {
      position: absolute;
      top: 12px;
      right: 15px;
      z-index: 10;
      padding: 6px 16px;
      border-radius: 4px;
      font-size: 13px;
      font-weight: bold;
      display: none;
      color: #fff;
      animation: pulse 1.2s infinite alternate;
    }
    .signal-put { background: #e53935; box-shadow: 0 0 10px rgba(229, 57, 53, 0.6); }
    .signal-call { background: #43a047; box-shadow: 0 0 10px rgba(67, 160, 71, 0.6); }

    @keyframes pulse {
      from { opacity: 0.7; }
      to { opacity: 1; transform: scale(1.02); }
    }

    #chartArea {
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>

  <div class="chart-frame">
    <div class="pair-badge" id="pairDisplay">5 EUR/USD</div>
    <div class="header-logo">
      <div class="crown-icon">♔♔♔</div>
      <div class="brand-title">DARK SECRET</div>
    </div>
    
    <div class="signal-box" id="signalBox">▼ PUT</div>

    <div id="chartArea"></div>
  </div>

<script>
  // Forex Pair Mapping to Standard Feed Stream
  const PAIR_MAP = {
    'EUR/USD': 'eurusdt', 'EURUSD': 'eurusdt',
    'USD/JPY': 'usdtjpy', 'USDJPY': 'usdtjpy',
    'CAD/JPY': 'cadjpy',  'CADJPY': 'cadjpy',
    'AUD/CAD': 'audcad',  'AUDCAD': 'audcad',
    'GBP/USD': 'gbpusdt', 'GBPUSD': 'gbpusdt',
    'EUR/JPY': 'eurjpy',  'EURJPY': 'eurjpy',
    'AUD/JPY': 'audjpy',  'AUDJPY': 'audjpy',
    'AUD/USD': 'audusdt', 'AUDUSD': 'audusdt',
    'EUR/GBP': 'eurgbp',  'EURGBP': 'eurgbp',
    'AUD/CHF': 'audchf',  'AUDCHF': 'audchf',
    'EUR/CAD': 'eurcad',  'EURCAD': 'eurcad',
    'GBP/CAD': 'gbpcad',  'GBPCAD': 'gbpcad'
  };

  function getSelectedPair() {
    const urlParams = new URLSearchParams(window.location.search);
    let pairParam = urlParams.get('pair');
    if (!pairParam) {
      const pathParts = window.location.pathname.split('/').filter(Boolean);
      if (pathParts.length > 0) pairParam = decodeURIComponent(pathParts[pathParts.length - 1]);
    }
    if (pairParam) {
      let clean = pairParam.toUpperCase().replace('-', '/');
      if (PAIR_MAP[clean]) return clean;
    }
    return 'EUR/USD';
  }

  const currentPair = getSelectedPair();
  const streamSymbol = PAIR_MAP[currentPair] || 'eurusdt';
  document.getElementById('pairDisplay').innerText = `5 ${currentPair}`;

  // UTC+6 (Bangladesh Time Offset)
  const UTC6_OFFSET = 6 * 3600;

  // Initialize TradingView Lightweight Chart
  const container = document.getElementById('chartArea');
  const chart = LightweightCharts.createChart(container, {
    width: container.clientWidth,
    height: container.clientHeight,
    layout: {
      backgroundColor: '#000000',
      textColor: '#888888',
    },
    grid: {
      vertLines: { color: '#111111' },
      horzLines: { color: '#111111' },
    },
    crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
    rightPriceScale: { borderColor: '#222222', visible: true },
    timeScale: { 
      borderColor: '#222222', 
      timeVisible: true, 
      secondsVisible: false,
      // Format time ticks directly to UTC+6
      tickMarkFormatter: (time) => {
        const date = new Date((time + UTC6_OFFSET) * 1000);
        const hours = String(date.getUTCHours()).padStart(2, '0');
        const minutes = String(date.getUTCMinutes()).padStart(2, '0');
        return `${hours}:${minutes}`;
      }
    },
    localization: {
      timeFormatter: (time) => {
        const date = new Date((time + UTC6_OFFSET) * 1000);
        const hours = String(date.getUTCHours()).padStart(2, '0');
        const minutes = String(date.getUTCMinutes()).padStart(2, '0');
        return `${hours}:${minutes}`;
      }
    }
  });

  const candleSeries = chart.addCandlestickSeries({
    upColor: '#26a69a',
    downColor: '#ef5350',
    borderUpColor: '#26a69a',
    borderDownColor: '#ef5350',
    wickUpColor: '#26a69a',
    wickDownColor: '#ef5350'
  });

  // Fetch 100% Real Historical Market Data
  async function loadHistoricalData() {
    try {
      const response = await fetch(`https://api.binance.com/api/v3/klines?symbol=${streamSymbol.toUpperCase()}&interval=1m&limit=120`);
      
      if (!response.ok) throw new Error('Data fetch failed');

      const data = await response.json();
      const formattedData = data.map(d => ({
        time: Math.floor(d[0] / 1000),
        open: parseFloat(d[1]),
        high: parseFloat(d[2]),
        low: parseFloat(d[3]),
        close: parseFloat(d[4])
      }));

      candleSeries.setData(formattedData);
      
      // Connect live stream if market is active
      connectRealWebSocket();
    } catch (err) {
      console.log('Real data load error:', err);
    }
  }

  // Connect Real-Time Live Stream WebSocket (Only updates when real trades happen)
  function connectRealWebSocket() {
    const ws = new WebSocket(`wss://stream.binance.com:9443/ws/${streamSymbol}@kline_1m`);

    ws.onmessage = (event) => {
      const message = JSON.parse(event.data);
      if (message.k) {
        const kline = message.k;
        candleSeries.update({
          time: Math.floor(kline.t / 1000),
          open: parseFloat(kline.o),
          high: parseFloat(kline.h),
          low: parseFloat(kline.l),
          close: parseFloat(kline.c)
        });
      }
    };

    ws.onclose = () => {
      setTimeout(connectRealWebSocket, 5000);
    };
  }

  loadHistoricalData();

  window.addEventListener('resize', () => {
    chart.applyOptions({
      width: container.clientWidth,
      height: container.clientHeight
    });
  });

  // Signal Bot Hook Function
  window.showSignal = function(type) {
    const box = document.getElementById('signalBox');
    if (type === 'PUT') {
      box.className = 'signal-box signal-put';
      box.innerText = '▼ PUT';
      box.style.display = 'block';
    } else if (type === 'CALL') {
      box.className = 'signal-box signal-call';
      box.innerText = '▲ CALL';
      box.style.display = 'block';
    } else {
      box.style.display = 'none';
    }
  };
</script>
</body>
</html>
