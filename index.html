<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DARK SECRET Pure Canvas Engine</title>
  <script src="https://unpkg.com/lightweight-charts@3.8.0/dist/lightweight-charts.standalone.production.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100vw;
      height: 100vh;
      background-color: #000000;
      color: #e0e0e0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    /* Gold Border Outer Frame */
    .chart-frame {
      position: relative;
      width: 98vw;
      height: 95vh;
      background: #000000;
      border: 2px solid #b3875a;
      border-radius: 6px;
      box-shadow: 0 0 25px rgba(179, 135, 90, 0.25);
      padding: 10px;
    }

    /* Inner Accent Frame Line */
    .inner-border {
      position: absolute;
      top: 4px; left: 4px; right: 4px; bottom: 4px;
      border: 1px solid rgba(179, 135, 90, 0.3);
      pointer-events: none;
      z-index: 5;
    }
    
    /* Header Branding */
    .header-logo {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      text-align: center;
      pointer-events: none;
    }
    .crown-icon { color: #d4af37; font-size: 14px; letter-spacing: 3px; }
    .brand-title { color: #e5c158; font-size: 15px; font-weight: 700; letter-spacing: 3px; text-transform: uppercase; text-shadow: 0 0 10px rgba(212,175,55,0.4); }

    /* Pair Info Badge */
    .pair-badge {
      position: absolute;
      top: 12px;
      left: 15px;
      z-index: 10;
      background: rgba(20, 20, 20, 0.9);
      border: 1px solid #333;
      padding: 6px 12px;
      border-radius: 4px;
      font-size: 13px;
      font-weight: bold;
      color: #fff;
    }

    /* Signal Box Overlay */
    .signal-box {
      position: absolute;
      top: 12px;
      right: 15px;
      z-index: 10;
      padding: 6px 16px;
      border-radius: 4px;
      font-size: 13px;
      font-weight: bold;
      display: none;
      color: #fff;
    }
    .signal-put { background: #e53935; box-shadow: 0 0 10px rgba(229, 57, 53, 0.6); }
    .signal-call { background: #43a047; box-shadow: 0 0 10px rgba(67, 160, 71, 0.6); }

    #chartArea {
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>

  <div class="chart-frame">
    <div class="inner-border"></div>
    <div class="pair-badge" id="pairDisplay">5 EUR/USD</div>
    <div class="header-logo">
      <div class="crown-icon">♔♔♔</div>
      <div class="brand-title">DARK SECRET</div>
    </div>
    
    <div class="signal-box" id="signalBox">▼ PUT</div>

    <div id="chartArea"></div>
  </div>

<script>
  function getSelectedPair() {
    const urlParams = new URLSearchParams(window.location.search);
    let pairParam = urlParams.get('pair');
    if (!pairParam) {
      const pathParts = window.location.pathname.split('/').filter(Boolean);
      if (pathParts.length > 0) pairParam = decodeURIComponent(pathParts[pathParts.length - 1]);
    }
    if (pairParam) {
      return pairParam.toUpperCase().replace('-', '/');
    }
    return 'EUR/USD';
  }

  const currentPair = getSelectedPair();
  document.getElementById('pairDisplay').innerText = `5 ${currentPair}`;

  // Explicit UTC+6 Offset (Bangladesh Standard Time)
  const UTC6_OFFSET = 6 * 3600;

  const container = document.getElementById('chartArea');
  const chart = LightweightCharts.createChart(container, {
    width: container.clientWidth,
    height: container.clientHeight,
    layout: {
      backgroundColor: '#000000',
      textColor: '#888888',
    },
    grid: {
      vertLines: { color: 'rgba(255, 255, 255, 0.05)' },
      horzLines: { color: 'rgba(255, 255, 255, 0.05)' },
    },
    crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
    rightPriceScale: { borderColor: '#222222', visible: true },
    timeScale: { 
      borderColor: '#222222', 
      timeVisible: true, 
      secondsVisible: false,
      tickMarkFormatter: (time) => {
        const date = new Date((time + UTC6_OFFSET) * 1000);
        const hours = String(date.getUTCHours()).padStart(2, '0');
        const minutes = String(date.getUTCMinutes()).padStart(2, '0');
        return `${hours}:${minutes}`;
      }
    },
    localization: {
      timeFormatter: (time) => {
        const date = new Date((time + UTC6_OFFSET) * 1000);
        const hours = String(date.getUTCHours()).padStart(2, '0');
        const minutes = String(date.getUTCMinutes()).padStart(2, '0');
        return `${hours}:${minutes}`;
      }
    }
  });

  const candleSeries = chart.addCandlestickSeries({
    upColor: '#00c853',
    downColor: '#d50000',
    borderUpColor: '#00c853',
    borderDownColor: '#d50000',
    wickUpColor: '#00c853',
    wickDownColor: '#d50000'
  });

  // Price Tick Generator to build candles continuously without CORS network failure
  let basePrice = 1.0850;
  let currentTime = Math.floor(Date.now() / 1000) - 3600;
  let candles = [];

  for (let i = 0; i < 60; i++) {
    let open = basePrice;
    let change = (Math.random() - 0.49) * 0.0008;
    let close = open + change;
    let high = Math.max(open, close) + Math.random() * 0.0003;
    let low = Math.min(open, close) - Math.random() * 0.0003;
    
    candles.push({
      time: currentTime,
      open: parseFloat(open.toFixed(5)),
      high: parseFloat(high.toFixed(5)),
      low: parseFloat(low.toFixed(5)),
      close: parseFloat(close.toFixed(5))
    });

    basePrice = close;
    currentTime += 60;
  }

  candleSeries.setData(candles);
  chart.timeScale().fitContent();

  // Live minute candle update engine
  let currentCandle = { ...candles[candles.length - 1] };
  
  setInterval(() => {
    let now = Math.floor(Date.now() / 1000);
    let minuteTimestamp = now - (now % 60);

    if (minuteTimestamp > currentCandle.time) {
      currentCandle = {
        time: minuteTimestamp,
        open: currentCandle.close,
        high: currentCandle.close,
        low: currentCandle.close,
        close: currentCandle.close
      };
    } else {
      let tick = (Math.random() - 0.49) * 0.00015;
      currentCandle.close = parseFloat((currentCandle.close + tick).toFixed(5));
      currentCandle.high = Math.max(currentCandle.high, currentCandle.close);
      currentCandle.low = Math.min(currentCandle.low, currentCandle.close);
    }

    candleSeries.update(currentCandle);
  }, 1000);

  window.addEventListener('resize', () => {
    chart.applyOptions({
      width: container.clientWidth,
      height: container.clientHeight
    });
  });

  // External Signal Trigger Function
  window.showSignal = function(type) {
    const box = document.getElementById('signalBox');
    if (type === 'PUT') {
      box.className = 'signal-box signal-put';
      box.innerText = '▼ PUT';
      box.style.display = 'block';
    } else if (type === 'CALL') {
      box.className = 'signal-box signal-call';
      box.innerText = '▲ CALL';
      box.style.display = 'block';
    } else {
      box.style.display = 'none';
    }
  };
</script>
</body>
</html>
