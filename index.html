<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DARK SECRET Real TradingView Engine</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100vw;
      height: 100vh;
      background-color: #000000;
      color: #e0e0e0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    /* Gold Border Outer Frame matching 2nd image */
    .chart-frame {
      position: relative;
      width: 98vw;
      height: 95vh;
      background: #000000;
      border: 2px solid #b3875a;
      border-radius: 6px;
      box-shadow: 0 0 25px rgba(179, 135, 90, 0.25);
      padding: 2px;
      overflow: hidden;
    }

    /* Inner Accent Frame Line */
    .inner-border {
      position: absolute;
      top: 4px; left: 4px; right: 4px; bottom: 4px;
      border: 1px solid rgba(179, 135, 90, 0.3);
      pointer-events: none;
      z-index: 25;
    }
    
    /* Header Logo & Crown matching 2nd image */
    .header-logo {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 30;
      text-align: center;
      pointer-events: none;
    }
    .crown-icon { color: #d4af37; font-size: 14px; letter-spacing: 3px; }
    .brand-title { color: #e5c158; font-size: 15px; font-weight: 700; letter-spacing: 3px; text-transform: uppercase; text-shadow: 0 0 10px rgba(212,175,55,0.4); }

    /* Pair Badge Overlay */
    .pair-badge {
      position: absolute;
      top: 10px;
      left: 12px;
      z-index: 30;
      background: rgba(15, 15, 15, 0.95);
      border: 1px solid #333;
      padding: 6px 12px;
      border-radius: 4px;
      font-size: 13px;
      font-weight: bold;
      color: #fff;
    }

    /* Signal Indicator Box */
    .signal-box {
      position: absolute;
      top: 10px;
      right: 12px;
      z-index: 30;
      padding: 6px 16px;
      border-radius: 4px;
      font-size: 13px;
      font-weight: bold;
      display: none;
      color: #fff;
    }
    .signal-put { background: #e53935; box-shadow: 0 0 10px rgba(229, 57, 53, 0.6); }
    .signal-call { background: #43a047; box-shadow: 0 0 10px rgba(67, 160, 71, 0.6); }

    /* Clean TradingView Embed Box */
    #tvContainer {
      width: 100%;
      height: 100%;
      position: relative;
      z-index: 10;
    }
  </style>
</head>
<body>

  <div class="chart-frame">
    <div class="inner-border"></div>
    <div class="pair-badge" id="pairDisplay">5 EUR/USD</div>
    
    <div class="header-logo">
      <div class="crown-icon">♔♔♔</div>
      <div class="brand-title">DARK SECRET</div>
    </div>
    
    <div class="signal-box" id="signalBox">▼ PUT</div>

    <div id="tvContainer"></div>
  </div>

  <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
  <script type="text/javascript">
    const PAIR_MAP = {
      'EUR/USD': 'FX:EURUSD', 'EURUSD': 'FX:EURUSD',
      'USD/JPY': 'FX:USDJPY', 'USDJPY': 'FX:USDJPY',
      'CAD/JPY': 'FX:CADJPY', 'CADJPY': 'FX:CADJPY',
      'AUD/CAD': 'FX:AUDCAD', 'AUDCAD': 'FX:AUDCAD',
      'GBP/USD': 'FX:GBPUSD', 'GBPUSD': 'FX:GBPUSD',
      'EUR/JPY': 'FX:EURJPY', 'EURJPY': 'FX:EURJPY',
      'AUD/JPY': 'FX:AUDJPY', 'AUDJPY': 'FX:AUDJPY',
      'AUD/USD': 'FX:AUDUSD', 'AUDUSD': 'FX:AUDUSD',
      'EUR/GBP': 'FX:EURGBP', 'EURGBP': 'FX:EURGBP',
      'AUD/CHF': 'FX:AUDCHF', 'AUDCHF': 'FX:AUDCHF',
      'EUR/CAD': 'FX:EURCAD', 'EURCAD': 'FX:EURCAD',
      'GBP/CAD': 'FX:GBPCAD', 'GBPCAD': 'GBPCAD'
    };

    function getSelectedPair() {
      const urlParams = new URLSearchParams(window.location.search);
      let pairParam = urlParams.get('pair');
      if (!pairParam) {
        const pathParts = window.location.pathname.split('/').filter(Boolean);
        if (pathParts.length > 0) pairParam = decodeURIComponent(pathParts[pathParts.length - 1]);
      }
      if (pairParam) {
        let clean = pairParam.toUpperCase().replace('-', '/');
        if (PAIR_MAP[clean]) return clean;
      }
      return 'EUR/USD';
    }

    const currentPair = getSelectedPair();
    const tvSymbol = PAIR_MAP[currentPair] || 'FX:EURUSD';
    document.getElementById('pairDisplay').innerText = `5 ${currentPair}`;

    // Pure TradingView Embedded Candle Renderer
    new TradingView.widget({
      "autosize": true,
      "symbol": tvSymbol,
      "interval": "1",
      "timezone": "Asia/Dhaka",
      "theme": "dark",
      "style": "1",
      "locale": "en",
      "toolbar_bg": "#000000",
      "enable_publishing": false,
      "hide_top_toolbar": true,
      "hide_legend": true,
      "save_image": false,
      "container_id": "tvContainer",
      "backgroundColor": "#000000",
      "gridColor": "rgba(20, 20, 20, 0.5)",
      "overrides": {
        "paneProperties.background": "#000000",
        "paneProperties.backgroundType": "solid",
        "paneProperties.vertGridProperties.color": "#111111",
        "paneProperties.horzGridProperties.color": "#111111",
        "mainSeriesProperties.candleStyle.upColor": "#00c853",
        "mainSeriesProperties.candleStyle.downColor": "#d50000",
        "mainSeriesProperties.candleStyle.drawWick": true,
        "mainSeriesProperties.candleStyle.drawBorder": true,
        "mainSeriesProperties.candleStyle.borderUpColor": "#00c853",
        "mainSeriesProperties.candleStyle.borderDownColor": "#d50000",
        "mainSeriesProperties.candleStyle.wickUpColor": "#00c853",
        "mainSeriesProperties.candleStyle.wickDownColor": "#d50000"
      }
    });

    // Signal Overlay Hook for Screenshot Automation
    window.showSignal = function(type) {
      const box = document.getElementById('signalBox');
      if (type === 'PUT') {
        box.className = 'signal-box signal-put';
        box.innerText = '▼ PUT';
        box.style.display = 'block';
      } else if (type === 'CALL') {
        box.className = 'signal-box signal-call';
        box.innerText = '▲ CALL';
        box.style.display = 'block';
      } else {
        box.style.display = 'none';
      }
    };
  </script>
</body>
</html>
