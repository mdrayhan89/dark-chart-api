<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DARK SECRET Real Engine</title>
  <script src="https://unpkg.com/lightweight-charts@3.8.0/dist/lightweight-charts.standalone.production.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100vw;
      height: 100vh;
      background-color: #000000;
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    /* Gold Border Outer Frame matching the screenshot perfectly */
    .chart-frame {
      position: relative;
      width: 98vw;
      height: 95vh;
      background: #000000;
      border: 2px solid #b3875a;
      border-radius: 6px;
      box-shadow: 0 0 25px rgba(179, 135, 90, 0.25);
      padding: 6px;
    }

    /* Inner Accent Frame Line */
    .inner-border {
      position: absolute;
      top: 4px; left: 4px; right: 4px; bottom: 4px;
      border: 1px solid rgba(179, 135, 90, 0.3);
      pointer-events: none;
      z-index: 5;
    }
    
    /* Header Logo & Crown matching screenshot */
    .header-logo {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      text-align: center;
      pointer-events: none;
    }
    .crown-icon { color: #d4af37; font-size: 13px; letter-spacing: 3px; }
    .brand-title { color: #e5c158; font-size: 14px; font-weight: 700; letter-spacing: 3px; text-transform: uppercase; text-shadow: 0 0 10px rgba(212,175,55,0.4); }

    /* Pair Display Badge */
    .pair-badge {
      position: absolute;
      top: 12px;
      left: 15px;
      z-index: 10;
      background: rgba(20, 20, 20, 0.9);
      border: 1px solid #333;
      padding: 5px 10px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: bold;
      color: #fff;
    }

    /* Signal Overlay Box */
    .signal-box {
      position: absolute;
      top: 12px;
      right: 15px;
      z-index: 10;
      padding: 6px 16px;
      border-radius: 4px;
      font-size: 13px;
      font-weight: bold;
      display: none;
      color: #fff;
    }
    .signal-put { background: #e53935; box-shadow: 0 0 10px rgba(229, 57, 53, 0.6); }
    .signal-call { background: #43a047; box-shadow: 0 0 10px rgba(67, 160, 71, 0.6); }

    #chartArea {
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>

  <div class="chart-frame">
    <div class="inner-border"></div>
    <div class="pair-badge" id="pairDisplay">5 EUR/USD</div>
    <div class="header-logo">
      <div class="crown-icon">♔♔♔</div>
      <div class="brand-title">DARK SECRET</div>
    </div>
    
    <div class="signal-box" id="signalBox">▼ PUT</div>

    <div id="chartArea"></div>
  </div>

<script>
  const PAIR_MAP = {
    'EUR/USD': 'EURUSDT', 'EURUSD': 'EURUSDT',
    'GBP/USD': 'GBPUSDT', 'GBPUSD': 'GBPUSDT',
    'AUD/USD': 'AUDUSDT', 'AUDUSD': 'AUDUSDT',
    'USD/JPY': 'USDJPY',  'USDJPY': 'USDJPY',
    'BTC/USD': 'BTCUSDT', 'BTCUSD': 'BTCUSDT'
  };

  function getSelectedPair() {
    const urlParams = new URLSearchParams(window.location.search);
    let pairParam = urlParams.get('pair');
    if (!pairParam) {
      const pathParts = window.location.pathname.split('/').filter(Boolean);
      if (pathParts.length > 0) pairParam = decodeURIComponent(pathParts[pathParts.length - 1]);
    }
    if (pairParam) {
      let clean = pairParam.toUpperCase().replace('-', '/');
      if (PAIR_MAP[clean]) return clean;
    }
    return 'EUR/USD';
  }

  const currentPair = getSelectedPair();
  const symbol = PAIR_MAP[currentPair] || 'EURUSDT';
  document.getElementById('pairDisplay').innerText = `5 ${currentPair}`;

  // UTC+6 Time Offset (Bangladesh)
  const UTC6_OFFSET = 6 * 3600;

  const container = document.getElementById('chartArea');
  const chart = LightweightCharts.createChart(container, {
    width: container.clientWidth,
    height: container.clientHeight,
    layout: {
      backgroundColor: '#000000',
      textColor: '#888888',
    },
    grid: {
      vertLines: { color: 'rgba(255, 255, 255, 0.04)' },
      horzLines: { color: 'rgba(255, 255, 255, 0.04)' },
    },
    crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
    rightPriceScale: { borderColor: '#222222', visible: true },
    timeScale: { 
      borderColor: '#222222', 
      timeVisible: true, 
      secondsVisible: false,
      tickMarkFormatter: (time) => {
        const date = new Date((time + UTC6_OFFSET) * 1000);
        const hours = String(date.getUTCHours()).padStart(2, '0');
        const minutes = String(date.getUTCMinutes()).padStart(2, '0');
        return `${hours}:${minutes}`;
      }
    },
    localization: {
      timeFormatter: (time) => {
        const date = new Date((time + UTC6_OFFSET) * 1000);
        const hours = String(date.getUTCHours()).padStart(2, '0');
        const minutes = String(date.getUTCMinutes()).padStart(2, '0');
        return `${hours}:${minutes}`;
      }
    }
  });

  const candleSeries = chart.addCandlestickSeries({
    upColor: '#00c853',
    downColor: '#d50000',
    borderUpColor: '#00c853',
    borderDownColor: '#d50000',
    wickUpColor: '#00c853',
    wickDownColor: '#d50000'
  });

  // Fetch Real Exchange Market Candles (No Random Data)
  async function loadRealData() {
    try {
      const res = await fetch(`https://api.binance.com/api/v3/klines?symbol=${symbol}&interval=1m&limit=80`);
      const data = await res.json();
      
      const candles = data.map(d => ({
        time: Math.floor(d[0] / 1000),
        open: parseFloat(d[1]),
        high: parseFloat(d[2]),
        low: parseFloat(d[3]),
        close: parseFloat(d[4])
      }));

      candleSeries.setData(candles);
      chart.timeScale().fitContent();
    } catch (e) {
      console.error("Real Data Fetch Error", e);
    }
  }

  loadRealData();

  // Sync Live Real-Time Ticks when available
  async function updateRealTick() {
    try {
      const res = await fetch(`https://api.binance.com/api/v3/klines?symbol=${symbol}&interval=1m&limit=1`);
      const data = await res.json();
      if (data && data.length > 0) {
        const d = data[0];
        candleSeries.update({
          time: Math.floor(d[0] / 1000),
          open: parseFloat(d[1]),
          high: parseFloat(d[2]),
          low: parseFloat(d[3]),
          close: parseFloat(d[4])
        });
      }
    } catch (e) {}
  }

  setInterval(updateRealTick, 3000);

  window.addEventListener('resize', () => {
    chart.applyOptions({
      width: container.clientWidth,
      height: container.clientHeight
    });
  });

  window.showSignal = function(type) {
    const box = document.getElementById('signalBox');
    if (type === 'PUT') {
      box.className = 'signal-box signal-put';
      box.innerText = '▼ PUT';
      box.style.display = 'block';
    } else if (type === 'CALL') {
      box.className = 'signal-box signal-call';
      box.innerText = '▲ CALL';
      box.style.display = 'block';
    } else {
      box.style.display = 'none';
    }
  };
</script>
</body>
</html>
