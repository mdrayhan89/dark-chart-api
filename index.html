<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DARK SECRET Trading View Chart</title>
  <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100vw;
      height: 100vh;
      background-color: #000000;
      color: #e0e0e0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .chart-frame {
      position: relative;
      width: 98vw;
      height: 95vh;
      background: #000000;
      border: 2px solid #b3875a;
      border-radius: 6px;
      box-shadow: 0 0 25px rgba(179, 135, 90, 0.25);
      padding: 5px;
    }
    
    /* Header Logo */
    .header-logo {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      text-align: center;
      pointer-events: none;
    }
    .crown-icon { color: #d4af37; font-size: 14px; letter-spacing: 3px; }
    .brand-title { color: #e5c158; font-size: 16px; font-weight: 700; letter-spacing: 3px; text-transform: uppercase; text-shadow: 0 0 10px rgba(212,175,55,0.4); }

    /* Pair Info Badge */
    .pair-badge {
      position: absolute;
      top: 10px;
      left: 12px;
      z-index: 20;
      background: rgba(15, 15, 15, 0.95);
      border: 1px solid #333;
      padding: 5px 12px;
      border-radius: 4px;
      font-size: 13px;
      font-weight: bold;
      color: #fff;
    }

    /* Signal Indicator Box */
    .signal-box {
      position: absolute;
      top: 10px;
      right: 12px;
      z-index: 20;
      padding: 5px 16px;
      border-radius: 4px;
      font-size: 13px;
      font-weight: bold;
      display: none;
      color: #fff;
      animation: pulse 1.2s infinite alternate;
    }
    .signal-put { background: #e53935; box-shadow: 0 0 10px rgba(229, 57, 53, 0.6); }
    .signal-call { background: #43a047; box-shadow: 0 0 10px rgba(67, 160, 71, 0.6); }

    @keyframes pulse {
      from { opacity: 0.7; }
      to { opacity: 1; transform: scale(1.02); }
    }

    #tv_chart_container {
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>

  <div class="chart-frame">
    <div class="pair-badge" id="pairDisplay">5 EUR/USD</div>
    <div class="header-logo">
      <div class="crown-icon">♔♔♔</div>
      <div class="brand-title">DARK SECRET</div>
    </div>
    
    <div class="signal-box" id="signalBox">▼ PUT</div>

    <!-- Real TradingView Widget Embed Container -->
    <div id="tv_chart_container"></div>
  </div>

<script>
  // TradingView Official Symbol Mapping (FX_IDC / OANDA Feed)
  const TRADINGVIEW_SYMBOLS = {
    'EUR/USD': 'FX_IDC:EURUSD', 'EURUSD': 'FX_IDC:EURUSD',
    'USD/JPY': 'FX_IDC:USDJPY', 'USDJPY': 'FX_IDC:USDJPY',
    'CAD/JPY': 'FX_IDC:CADJPY', 'CADJPY': 'FX_IDC:CADJPY',
    'AUD/CAD': 'FX_IDC:AUDCAD', 'AUDCAD': 'FX_IDC:AUDCAD',
    'GBP/USD': 'FX_IDC:GBPUSD', 'GBPUSD': 'FX_IDC:GBPUSD',
    'EUR/JPY': 'FX_IDC:EURJPY', 'EURJPY': 'FX_IDC:EURJPY',
    'AUD/JPY': 'FX_IDC:AUDJPY', 'AUDJPY': 'FX_IDC:AUDJPY',
    'AUD/USD': 'FX_IDC:AUDUSD', 'AUDUSD': 'FX_IDC:AUDUSD',
    'EUR/GBP': 'FX_IDC:EURGBP', 'EURGBP': 'FX_IDC:EURGBP',
    'AUD/CHF': 'FX_IDC:AUDCHF', 'AUDCHF': 'FX_IDC:AUDCHF',
    'EUR/CAD': 'FX_IDC:EURCAD', 'EURCAD': 'FX_IDC:EURCAD',
    'GBP/CAD': 'FX_IDC:GBPCAD', 'GBPCAD': 'FX_IDC:GBPCAD'
  };

  function getSelectedPair() {
    const urlParams = new URLSearchParams(window.location.search);
    let pairParam = urlParams.get('pair');
    if (!pairParam) {
      const pathParts = window.location.pathname.split('/').filter(Boolean);
      if (pathParts.length > 0) pairParam = decodeURIComponent(pathParts[pathParts.length - 1]);
    }
    if (pairParam) {
      let clean = pairParam.toUpperCase().replace('-', '/');
      if (TRADINGVIEW_SYMBOLS[clean]) return clean;
    }
    return 'EUR/USD';
  }

  const currentPair = getSelectedPair();
  const tvSymbol = TRADINGVIEW_SYMBOLS[currentPair] || 'FX_IDC:EURUSD';
  document.getElementById('pairDisplay').innerText = `5 ${currentPair}`;

  // Load Official TradingView Chart Widget
  new TradingView.widget({
    "autosize": true,
    "symbol": tvSymbol,
    "interval": "1",
    "timezone": "Asia/Dhaka", // UTC+6 Bangladesh Time
    "theme": "dark",
    "style": "1", // Candlesticks
    "locale": "en",
    "toolbar_bg": "#000000",
    "enable_publishing": false,
    "hide_top_toolbar": true,
    "hide_legend": true,
    "save_image": false,
    "container_id": "tv_chart_container",
    "backgroundColor": "#000000",
    "gridColor": "#111111",
    "overrides": {
      "mainSeriesProperties.candleStyle.upColor": "#26a69a",
      "mainSeriesProperties.candleStyle.downColor": "#ef5350",
      "mainSeriesProperties.candleStyle.borderUpColor": "#26a69a",
      "mainSeriesProperties.candleStyle.borderDownColor": "#ef5350",
      "mainSeriesProperties.candleStyle.wickUpColor": "#26a69a",
      "mainSeriesProperties.candleStyle.wickDownColor": "#ef5350"
    }
  });

  // Signal Bot Receiver
  window.showSignal = function(type) {
    const box = document.getElementById('signalBox');
    if (type === 'PUT') {
      box.className = 'signal-box signal-put';
      box.innerText = '▼ PUT';
      box.style.display = 'block';
    } else if (type === 'CALL') {
      box.className = 'signal-box signal-call';
      box.innerText = '▲ CALL';
      box.style.display = 'block';
    } else {
      box.style.display = 'none';
    }
  };
</script>
</body>
</html>
